# Supabase free-tier keep-alive, redundant with the Vercel cron
# (/api/cron/db-ping). Supabase pauses free projects after ~7 days
# without PLATFORM API activity — this hits the REST API directly so
# the idle timer resets even if the Vercel cron or the app is down.
#
# The URL and publishable key are public by design (they ship in any
# frontend); RLS deny-all means the request returns no data, but it
# still counts as activity.
#
# NB: GitHub disables scheduled workflows after ~60 days without repo
# activity — any commit re-enables them. Fine while the project is
# actively developed; revisit if the repo goes quiet.
name: keepalive

on:
  schedule:
    - cron: "23 7 * * *" # daily 07:23 UTC (offset from Vercel's 04:00)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API (resets free-tier idle timer)
        run: |
          # Table endpoint, not the /rest/v1/ root (root needs a secret
          # key). Deny-all RLS returns 200 with an empty array.
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: sb_publishable_I_gfVWp3mYhwN7zOHnCckg_pJc86GWv" \
            "https://pmuvvacjsntbcxefiiff.supabase.co/rest/v1/projects?select=id&limit=1")
          echo "supabase rest status: $status"
          [ "$status" = "200" ]

      - name: Ping app health endpoint (DB + tRPC module graph + sharp)
        run: |
          body=$(curl -s -m 20 "https://www.sitefile.app/api/health")
          echo "health body: $body"
          echo "$body" | grep -q '"ok":true'

      # The API can be dead while /api/health is green if a check regresses
      # — assert the real tRPC route serves JSON, not Next's HTML /500 page.
      # (2026-09-01: sharp's libvips went missing on Vercel and every tRPC
      # call served HTML for 3 days behind a green health check.)
      - name: Assert tRPC route serves JSON (any status, never HTML)
        run: |
          ct=$(curl -s -o /dev/null -m 20 -w "%{content_type}" \
            "https://www.sitefile.app/api/trpc/project.list?batch=1&input=%7B%7D")
          echo "trpc content-type: $ct"
          case "$ct" in application/json*) ;; *) echo "expected JSON, got: $ct"; exit 1;; esac
